[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "air-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server for the Agent Identity Registry (AIR)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Agent Identity Registry Foundation" },
]
keywords = ["mcp", "model-context-protocol", "agent-identity", "did-wba", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.12,<2.0",
    "agent-identity-registry>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
air-mcp-server = "air_mcp.__main__:main"

[project.urls]
Homepage = "https://agentidentityregistry.org"
Repository = "https://github.com/AgentIdentityRegistry/air-site"

[tool.hatch.build.targets.wheel]
packages = ["src/air_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
